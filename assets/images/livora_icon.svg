<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="livoraGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006852" />
      <stop offset="40%" stop-color="#00A878" />
      <stop offset="80%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="livoraGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B2B" />
      <stop offset="50%" stop-color="#008060" />
      <stop offset="100%" stop-color="#0096C7" />
    </linearGradient>
  </defs>

  <!-- L del fondo / Lazo base (Capa de profundidad) -->
  <path d="M 110,190
           L 110,360
           C 110,390 135,410 165,410
