           C 310,410 325,400 330,380
           L 300,345
           L 175,345
           C 165,345 160,340 160,330
           L 160,210
           Z"
        fill="url(#livoraGrad2)" />

  <!-- Nodo Central y Bucle en O / S (Capa media) -->
  <path d="M 160,280
           C 160,200 220,180 270,180
           C 330,180 370,225 370,285
           C 370,325 345,360 310,375
           L 270,330
           C 295,320 310,298 310,280
           C 310,245 285,225 255,225
           C 215,225 205,255 205,280
           Z"
        fill="url(#livoraGrad1)" />

  <!-- Cinta Diagonal con Flecha en Ascenso (Capa superior) -->
  <path d="M 110,360
           C 140,360 190,320 230,280
           L 320,190
           L 290,190
           L 345,135
           L 395,200
           L 365,200
           L 270,295
           C 220,345 160,410 110,360 Z"
        fill="url(#livoraGrad1)" />

  <!-- Detalle del Bisel / Faceta Tech de la Flecha (Brillo) -->
  <path d="M 345,135
           L 395,200
           L 365,200
           L 308,258
           Z"
        fill="#00E5A3"
        opacity="0.4" />
</svg>
